services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  backend:
    init: true
    build:
      context: ./backend
      dockerfile: Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=leafletpilot_app"
      - "traefik.http.middlewares.leafletpilot-api-gzip.compress=true"
      - "traefik.http.middlewares.leafletpilot-api-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.leafletpilot-api-http.entrypoints=http"
      - "traefik.http.routers.leafletpilot-api-http.rule=Host(`api.leafletpilot.com`) && PathPrefix(`/`)"
      - "traefik.http.routers.leafletpilot-api-http.middlewares=leafletpilot-api-redirect"
      - "traefik.http.routers.leafletpilot-api-http.service=leafletpilot-api"
      - "traefik.http.routers.leafletpilot-api-https.entrypoints=https"
      - "traefik.http.routers.leafletpilot-api-https.rule=Host(`api.leafletpilot.com`) && PathPrefix(`/`)"
      - "traefik.http.routers.leafletpilot-api-https.middlewares=leafletpilot-api-gzip"
      - "traefik.http.routers.leafletpilot-api-https.tls=true"
      - "traefik.http.routers.leafletpilot-api-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.leafletpilot-api-https.service=leafletpilot-api"
      - "traefik.http.services.leafletpilot-api.loadbalancer.server.port=8000"

    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DEBUG: "false"

      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      INVITATION_EMAIL_DELIVERY: ${INVITATION_EMAIL_DELIVERY:-disabled}
      INVITATION_SMTP_HOST: ${INVITATION_SMTP_HOST:-}
      INVITATION_SMTP_PORT: ${INVITATION_SMTP_PORT:-587}
      INVITATION_SMTP_USERNAME: ${INVITATION_SMTP_USERNAME:-}
      INVITATION_SMTP_PASSWORD: ${INVITATION_SMTP_PASSWORD:-}
      INVITATION_SMTP_FROM_ADDRESS: ${INVITATION_SMTP_FROM_ADDRESS:-}
      INVITATION_SMTP_FROM_NAME: ${INVITATION_SMTP_FROM_NAME:-LeafletPilot}
      INVITATION_SMTP_SECURITY: ${INVITATION_SMTP_SECURITY:-starttls}
      INVITATION_SMTP_TIMEOUT_SECONDS: ${INVITATION_SMTP_TIMEOUT_SECONDS:-15}
      INVITATION_EXPIRE_DAYS: ${INVITATION_EXPIRE_DAYS:-7}

      DEMO_OPERATIONS_ENABLED: ${DEMO_OPERATIONS_ENABLED:-false}
      DEMO_MARKET_ID: ${DEMO_MARKET_ID:-}
      DEMO_MARKET_SLUG: ${DEMO_MARKET_SLUG:-}
      DEMO_OWNER_EMAIL: ${DEMO_OWNER_EMAIL:-}
      DEMO_OWNER_INITIAL_PASSWORD: ${DEMO_OWNER_INITIAL_PASSWORD:-}

      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:?ACCESS_TOKEN_EXPIRE_MINUTES is required}

      PLATFORM_ADMIN_ENABLED: ${PLATFORM_ADMIN_ENABLED:-false}
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:-}
      PLATFORM_ACCESS_TOKEN_EXPIRE_MINUTES: ${PLATFORM_ACCESS_TOKEN_EXPIRE_MINUTES:-240}

      PUBLIC_SIGNUP_THROTTLE_SECRET: ${PUBLIC_SIGNUP_THROTTLE_SECRET:?PUBLIC_SIGNUP_THROTTLE_SECRET is required}
      PUBLIC_SIGNUP_THROTTLE_WINDOW_MINUTES: ${PUBLIC_SIGNUP_THROTTLE_WINDOW_MINUTES:-60}
      PUBLIC_SIGNUP_THROTTLE_LIMIT: ${PUBLIC_SIGNUP_THROTTLE_LIMIT:-3}

      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:?BACKEND_CORS_ORIGINS is required}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?FRONTEND_BASE_URL is required}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?TRUSTED_HOSTS is required}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      SECURE_PROXY_HEADERS: ${SECURE_PROXY_HEADERS:-false}

      LOCAL_STORAGE_DIR: /app/storage
      LOG_LEVEL: ${LOG_LEVEL:?LOG_LEVEL is required}

      TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_BASE_URL: ${TELEGRAM_WEBHOOK_BASE_URL:-}
      TELEGRAM_HTTP_TIMEOUT_SECONDS: ${TELEGRAM_HTTP_TIMEOUT_SECONDS:-20}
      TELEGRAM_HTTP_MAX_ATTEMPTS: ${TELEGRAM_HTTP_MAX_ATTEMPTS:-1}

      # AI-2 natural-language revision parsing. Disabled unless both kill
      # switches are true and an isolated provider profile is configured.
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_REVISION_ENABLED: ${AI_REVISION_ENABLED:-false}
      AI_REVISION_PROVIDER: ${AI_REVISION_PROVIDER:-openai_compatible}
      AI_REVISION_MODEL: ${AI_REVISION_MODEL:-}
      AI_COMPLEX_REVISION_PROVIDER: ${AI_COMPLEX_REVISION_PROVIDER:-}
      AI_COMPLEX_REVISION_MODEL: ${AI_COMPLEX_REVISION_MODEL:-}
      AI_FALLBACK_PROVIDER: ${AI_FALLBACK_PROVIDER:-}
      AI_FALLBACK_MODEL: ${AI_FALLBACK_MODEL:-}
      AI_OPENAI_COMPATIBLE_API_BASE_URL: ${AI_OPENAI_COMPATIBLE_API_BASE_URL:-https://api.openai.com/v1}
      AI_OPENAI_COMPATIBLE_API_KEY: ${AI_OPENAI_COMPATIBLE_API_KEY:-}
      AI_HTTP_TIMEOUT_SECONDS: ${AI_HTTP_TIMEOUT_SECONDS:-15}
      AI_HTTP_MAX_ATTEMPTS: ${AI_HTTP_MAX_ATTEMPTS:-2}
      AI_MAX_INSTRUCTION_LENGTH: ${AI_MAX_INSTRUCTION_LENGTH:-2000}
      AI_MAX_ACTIONS_PER_REQUEST: ${AI_MAX_ACTIONS_PER_REQUEST:-20}
      AI_PROPOSAL_EXPIRE_MINUTES: ${AI_PROPOSAL_EXPIRE_MINUTES:-15}
      AI_REVISION_RATE_LIMIT_PER_MINUTE: ${AI_REVISION_RATE_LIMIT_PER_MINUTE:-5}
      AI_PROFESSIONALIZATION_ENABLED: ${AI_PROFESSIONALIZATION_ENABLED:-false}
      AI_PROFESSIONALIZATION_PROVIDER: ${AI_PROFESSIONALIZATION_PROVIDER:-}
      AI_PROFESSIONALIZATION_MODEL: ${AI_PROFESSIONALIZATION_MODEL:-}
      AI_PROFESSIONALIZATION_FALLBACK_PROVIDER: ${AI_PROFESSIONALIZATION_FALLBACK_PROVIDER:-}
      AI_PROFESSIONALIZATION_FALLBACK_MODEL: ${AI_PROFESSIONALIZATION_FALLBACK_MODEL:-}
      AI_PROFESSIONALIZATION_RATE_LIMIT_PER_MINUTE: ${AI_PROFESSIONALIZATION_RATE_LIMIT_PER_MINUTE:-3}
      AI_PROFESSIONALIZATION_MAX_RUNS_PER_CAMPAIGN: ${AI_PROFESSIONALIZATION_MAX_RUNS_PER_CAMPAIGN:-5}

      # Central WhatsApp channel (Evolution API). Off by default. Evolution
      # API is NOT one of the services below — it is an external/self-hosted
      # dependency this container reaches over the `egress` network. See
      # deploy/evolution/docker-compose.evolution.example.yml (reference
      # stack) and docs/backend/10_WHATSAPP_EVOLUTION_SETUP.md (runbook).
      EVOLUTION_WHATSAPP_ENABLED: ${EVOLUTION_WHATSAPP_ENABLED:-false}
      EVOLUTION_API_BASE_URL: ${EVOLUTION_API_BASE_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-}
      EVOLUTION_WEBHOOK_SECRET: ${EVOLUTION_WEBHOOK_SECRET:-}
      LEAFLETPILOT_WHATSAPP_NUMBER: ${LEAFLETPILOT_WHATSAPP_NUMBER:-}
      EVOLUTION_HTTP_TIMEOUT_SECONDS: ${EVOLUTION_HTTP_TIMEOUT_SECONDS:-20}
      WHATSAPP_VERIFICATION_EXPIRE_MINUTES: ${WHATSAPP_VERIFICATION_EXPIRE_MINUTES:-10}
      WHATSAPP_VERIFICATION_RESEND_COOLDOWN_SECONDS: ${WHATSAPP_VERIFICATION_RESEND_COOLDOWN_SECONDS:-60}
      WHATSAPP_VERIFICATION_MAX_ATTEMPTS: ${WHATSAPP_VERIFICATION_MAX_ATTEMPTS:-5}
      WHATSAPP_RATE_LIMIT_WINDOW_MINUTES: ${WHATSAPP_RATE_LIMIT_WINDOW_MINUTES:-10}
      WHATSAPP_VERIFICATION_REQUEST_LIMIT: ${WHATSAPP_VERIFICATION_REQUEST_LIMIT:-5}
      WHATSAPP_INBOUND_MESSAGE_LIMIT: ${WHATSAPP_INBOUND_MESSAGE_LIMIT:-60}
      WHATSAPP_WEBHOOK_IP_LIMIT: ${WHATSAPP_WEBHOOK_IP_LIMIT:-600}

      STRIPE_ENABLED: ${STRIPE_ENABLED:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_LOOKUP_KEY_STARTER: ${STRIPE_PRICE_LOOKUP_KEY_STARTER:-leafletpilot_starter_monthly_eur}
      STRIPE_PRICE_LOOKUP_KEY_STANDARD: ${STRIPE_PRICE_LOOKUP_KEY_STANDARD:-leafletpilot_standard_monthly_eur}
      STRIPE_PRICE_LOOKUP_KEY_PRO: ${STRIPE_PRICE_LOOKUP_KEY_PRO:-leafletpilot_pro_monthly_eur}
      # Left blank by default: resolved as `${FRONTEND_BASE_URL}/#/settings/billing[...]`
      # (hash-router path — this app has no server-side routing). Only set
      # these explicitly if that derived URL is wrong, and if so, keep the
      # `/#/` prefix intact.
      STRIPE_CHECKOUT_SUCCESS_URL: ${STRIPE_CHECKOUT_SUCCESS_URL:-}
      STRIPE_CHECKOUT_CANCEL_URL: ${STRIPE_CHECKOUT_CANCEL_URL:-}
      STRIPE_PORTAL_RETURN_URL: ${STRIPE_PORTAL_RETURN_URL:-}
      STRIPE_AUTOMATIC_TAX_ENABLED: ${STRIPE_AUTOMATIC_TAX_ENABLED:-false}
    volumes:
      - leafletpilot_storage:/app/storage
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/db', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 30s
    networks:
      - app
      - egress

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL is required}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=leafletpilot_app"
      - "traefik.http.middlewares.leafletpilot-web-gzip.compress=true"
      - "traefik.http.middlewares.leafletpilot-web-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.leafletpilot-web-http.entrypoints=http"
      - "traefik.http.routers.leafletpilot-web-http.rule=(Host(`leafletpilot.com`) || Host(`www.leafletpilot.com`)) && PathPrefix(`/`)"
      - "traefik.http.routers.leafletpilot-web-http.middlewares=leafletpilot-web-redirect"
      - "traefik.http.routers.leafletpilot-web-http.service=leafletpilot-web"
      - "traefik.http.routers.leafletpilot-web-https.entrypoints=https"
      - "traefik.http.routers.leafletpilot-web-https.rule=(Host(`leafletpilot.com`) || Host(`www.leafletpilot.com`)) && PathPrefix(`/`)"
      - "traefik.http.routers.leafletpilot-web-https.middlewares=leafletpilot-web-gzip"
      - "traefik.http.routers.leafletpilot-web-https.tls=true"
      - "traefik.http.routers.leafletpilot-web-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.leafletpilot-web-https.service=leafletpilot-web"
      - "traefik.http.services.leafletpilot-web.loadbalancer.server.port=8080"

    restart: unless-stopped
    expose:
      - "8080"
    depends_on:
      - backend
    networks:
      - app

  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles:
      - migration
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DEBUG: "false"

      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      INVITATION_EMAIL_DELIVERY: ${INVITATION_EMAIL_DELIVERY:-disabled}
      INVITATION_SMTP_HOST: ${INVITATION_SMTP_HOST:-}
      INVITATION_SMTP_PORT: ${INVITATION_SMTP_PORT:-587}
      INVITATION_SMTP_USERNAME: ${INVITATION_SMTP_USERNAME:-}
      INVITATION_SMTP_PASSWORD: ${INVITATION_SMTP_PASSWORD:-}
      INVITATION_SMTP_FROM_ADDRESS: ${INVITATION_SMTP_FROM_ADDRESS:-}
      INVITATION_SMTP_FROM_NAME: ${INVITATION_SMTP_FROM_NAME:-LeafletPilot}
      INVITATION_SMTP_SECURITY: ${INVITATION_SMTP_SECURITY:-starttls}
      INVITATION_SMTP_TIMEOUT_SECONDS: ${INVITATION_SMTP_TIMEOUT_SECONDS:-15}
      INVITATION_EXPIRE_DAYS: ${INVITATION_EXPIRE_DAYS:-7}

      DEMO_OPERATIONS_ENABLED: ${DEMO_OPERATIONS_ENABLED:-false}
      DEMO_MARKET_ID: ${DEMO_MARKET_ID:-}
      DEMO_MARKET_SLUG: ${DEMO_MARKET_SLUG:-}
      DEMO_OWNER_EMAIL: ${DEMO_OWNER_EMAIL:-}
      DEMO_OWNER_INITIAL_PASSWORD: ${DEMO_OWNER_INITIAL_PASSWORD:-}

      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:?ACCESS_TOKEN_EXPIRE_MINUTES is required}

      PLATFORM_ADMIN_ENABLED: ${PLATFORM_ADMIN_ENABLED:-false}
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:-}
      PLATFORM_ACCESS_TOKEN_EXPIRE_MINUTES: ${PLATFORM_ACCESS_TOKEN_EXPIRE_MINUTES:-240}

      PUBLIC_SIGNUP_THROTTLE_SECRET: ${PUBLIC_SIGNUP_THROTTLE_SECRET:?PUBLIC_SIGNUP_THROTTLE_SECRET is required}
      PUBLIC_SIGNUP_THROTTLE_WINDOW_MINUTES: ${PUBLIC_SIGNUP_THROTTLE_WINDOW_MINUTES:-60}
      PUBLIC_SIGNUP_THROTTLE_LIMIT: ${PUBLIC_SIGNUP_THROTTLE_LIMIT:-3}

      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:?BACKEND_CORS_ORIGINS is required}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?FRONTEND_BASE_URL is required}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?TRUSTED_HOSTS is required}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      SECURE_PROXY_HEADERS: ${SECURE_PROXY_HEADERS:-false}

      LOCAL_STORAGE_DIR: /app/storage
      LOG_LEVEL: ${LOG_LEVEL:?LOG_LEVEL is required}

      TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_BASE_URL: ${TELEGRAM_WEBHOOK_BASE_URL:-}
      TELEGRAM_HTTP_TIMEOUT_SECONDS: ${TELEGRAM_HTTP_TIMEOUT_SECONDS:-20}
      TELEGRAM_HTTP_MAX_ATTEMPTS: ${TELEGRAM_HTTP_MAX_ATTEMPTS:-1}

      # Central WhatsApp channel (Evolution API). Off by default. Evolution
      # API is NOT one of the services below — it is an external/self-hosted
      # dependency this container reaches over the `egress` network. See
      # deploy/evolution/docker-compose.evolution.example.yml (reference
      # stack) and docs/backend/10_WHATSAPP_EVOLUTION_SETUP.md (runbook).
      EVOLUTION_WHATSAPP_ENABLED: ${EVOLUTION_WHATSAPP_ENABLED:-false}
      EVOLUTION_API_BASE_URL: ${EVOLUTION_API_BASE_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-}
      EVOLUTION_WEBHOOK_SECRET: ${EVOLUTION_WEBHOOK_SECRET:-}
      LEAFLETPILOT_WHATSAPP_NUMBER: ${LEAFLETPILOT_WHATSAPP_NUMBER:-}
      EVOLUTION_HTTP_TIMEOUT_SECONDS: ${EVOLUTION_HTTP_TIMEOUT_SECONDS:-20}
      WHATSAPP_VERIFICATION_EXPIRE_MINUTES: ${WHATSAPP_VERIFICATION_EXPIRE_MINUTES:-10}
      WHATSAPP_VERIFICATION_RESEND_COOLDOWN_SECONDS: ${WHATSAPP_VERIFICATION_RESEND_COOLDOWN_SECONDS:-60}
      WHATSAPP_VERIFICATION_MAX_ATTEMPTS: ${WHATSAPP_VERIFICATION_MAX_ATTEMPTS:-5}
      WHATSAPP_RATE_LIMIT_WINDOW_MINUTES: ${WHATSAPP_RATE_LIMIT_WINDOW_MINUTES:-10}
      WHATSAPP_VERIFICATION_REQUEST_LIMIT: ${WHATSAPP_VERIFICATION_REQUEST_LIMIT:-5}
      WHATSAPP_INBOUND_MESSAGE_LIMIT: ${WHATSAPP_INBOUND_MESSAGE_LIMIT:-60}
      WHATSAPP_WEBHOOK_IP_LIMIT: ${WHATSAPP_WEBHOOK_IP_LIMIT:-600}

      STRIPE_ENABLED: ${STRIPE_ENABLED:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_LOOKUP_KEY_STARTER: ${STRIPE_PRICE_LOOKUP_KEY_STARTER:-leafletpilot_starter_monthly_eur}
      STRIPE_PRICE_LOOKUP_KEY_STANDARD: ${STRIPE_PRICE_LOOKUP_KEY_STANDARD:-leafletpilot_standard_monthly_eur}
      STRIPE_PRICE_LOOKUP_KEY_PRO: ${STRIPE_PRICE_LOOKUP_KEY_PRO:-leafletpilot_pro_monthly_eur}
      # Left blank by default: resolved as `${FRONTEND_BASE_URL}/#/settings/billing[...]`
      # (hash-router path — this app has no server-side routing). Only set
      # these explicitly if that derived URL is wrong, and if so, keep the
      # `/#/` prefix intact.
      STRIPE_CHECKOUT_SUCCESS_URL: ${STRIPE_CHECKOUT_SUCCESS_URL:-}
      STRIPE_CHECKOUT_CANCEL_URL: ${STRIPE_CHECKOUT_CANCEL_URL:-}
      STRIPE_PORTAL_RETURN_URL: ${STRIPE_PORTAL_RETURN_URL:-}
      STRIPE_AUTOMATIC_TAX_ENABLED: ${STRIPE_AUTOMATIC_TAX_ENABLED:-false}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    networks:
      - app

volumes:
  postgres_data:
  leafletpilot_storage:

networks:
  app:
    internal: true
  egress:
    driver: bridge
    internal: false

